appId: com.zcati.codeman-agent
productName: codeman-agent
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asarUnpack:
  - "**/*.node"
extraResources:
  - from: "electron/resources"
    to: "skills"
    filter: ["**/*"]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish: null
